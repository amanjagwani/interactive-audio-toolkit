[platformio]
default_envs = esp32
src_dir = .
data_dir = examples/web-ui/data

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
build_flags = -I src
build_src_filter = -<*> +<examples/basic/> +<ci/>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
	FS
	Wire
	WiFi
	ESPmDNS
	LittleFS
	Preferences
	bblanchon/ArduinoJson@7.4.3
	sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@1.2.12
	opensensinglab/TFMini@0.1.0
	waspinator/AccelStepper@1.64.0
	budryerson/TFMPI2C@1.6.0
	olkal/HX711_ADC@1.2.12
	boschsensortec/BME68x Sensor library@1.2.40408
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0

[env:esp32]
board = featheresp32

[env:esp32s3]
board = esp32-s3-devkitc1-n16r8
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32p4]
board = esp32-p4

[web]
build_src_filter = -<*> +<examples/web-ui/> +<ci/>

[env:esp32-web]
extends = env:esp32, web

[env:esp32s3-web]
extends = env:esp32s3, web

[env:esp32p4-web]
extends = env:esp32p4, web
