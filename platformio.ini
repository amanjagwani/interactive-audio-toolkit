[platformio]
default_envs = esp32
src_dir = examples/basic

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
build_flags = -I src
build_src_filter = +<*> +<../../ci/allHeaders.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
	FS
	Wire
	bblanchon/ArduinoJson@7.4.3
	sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@1.2.12
	queuetue/Queuetue HX711 Library@1.0.2
	opensensinglab/TFMini@0.1.0
	waspinator/AccelStepper@1.64.0
	budryerson/TFMPI2C@1.6.0
	olkal/HX711_ADC@1.2.12
	boschsensortec/BME68x Sensor library@1.2.40408

[env:esp32]
board = featheresp32

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32p4]
board = esp32-p4
